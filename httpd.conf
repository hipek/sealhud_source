# BusyBox httpd config: MIME types for the SealHUD build output.
# The in-game browser rejects stylesheets/scripts served with a wrong type.
.html:text/html; charset=utf-8
.js:text/javascript; charset=utf-8
.css:text/css; charset=utf-8
.json:application/json
.txt:text/plain; charset=utf-8
.svg:image/svg+xml
.png:image/png
.gif:image/gif
.jpg:image/jpeg
.cur:image/x-icon
.ico:image/x-icon
.woff2:font/woff2
.woff:font/woff
.ttf:font/ttf
.wav:audio/wav
